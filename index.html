<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVIVE</title>
    <style>
        :root {
            --bg: #0d0e12;
            --card-bg: #16181e;
            --accent: #ff0000;
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --green: #2ecc71;
            --red-disabled: #3a1c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-top: 80px;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: linear-gradient(180deg, #000000 70%, rgba(255, 0, 0, 0.4) 100%);
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            padding: 0 12px;
        }

        .loader {
            text-align: center;
            color: var(--text-sub);
            margin-top: 30px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid #262931;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .game-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #20232c;
            border: 1px solid #323644;
            object-fit: cover;
        }

        .game-title h2 {
            font-size: 1.25rem;
            line-height: 1.2;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
            background: #222733;
            color: var(--green);
            margin-top: 4px;
        }

        .description {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
            margin-bottom: 16px;
            background: #101116;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1c1e26;
        }

        .download-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-active {
            background: var(--green);
            color: #000;
        }

        .btn-disabled {
            background: var(--red-disabled);
            color: #ff6b6b;
            cursor: not-allowed;
            border: 1px solid #522323;
            pointer-events: none;
        }

        .btn span {
            font-size: 0.65rem;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>RVIVE</h1>
    </header>

    <div class="wrapper">
        <main id="app-list">
            <div class="loader">Загрузка приложений из базы данных...</div>
        </main>
    </div>

    <script>
        async function loadApps() {
            const container = document.getElementById('app-list');
            try {
                // Если база лежит в другом месте/файле, поправь имя здесь (например 'games.json')
                const res = await fetch('https://raw.githubusercontent.com/Amarasenik/Rvive/refs/heads/main/games.json');

                if (!res.ok) throw new Error('Ошибка сети');
                const apps = await res.json();

                container.innerHTML = '';

                apps.forEach(app => {
                    const win = app.platforms?.windows || {};
                    const android = app.platforms?.android || {};

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <img src="${app.icon || ''}" alt="${app.title}" class="game-icon" onerror="this.src='https://via.placeholder.com/60?text=APP'">
                            <div class="game-title">
                                <h2>${app.title}</h2>
                                <span class="badge">v${app.version || '1.0'}</span>
                            </div>
                        </div>

                        

                       <a href="download.html?id=${app.id}" class="btn btn-active" style="display: block; text-align: center; text-decoration: none; margin-top: 14px; padding: 12px;">
            Скачать
            <span style="display: block; font-size: 0.65rem; font-weight: normal; opacity: 0.8; margin-top: 2px;">Выбрать платформу</span>
        </a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="loader" style="color: #ff3333;">Не удалось загрузить games.json. Проверь имя файла базы данных!</div>`;
            }
        }

        loadApps();
    </script>
</body>
</html>
