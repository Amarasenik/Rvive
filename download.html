<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVIVE — Загрузка</title>
    <style>
        :root {
            --bg: #0d0e12;
            --card-bg: #16181e;
            --accent: #ff0000;
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --green: #2ecc71;
            --green-hover: #27ae60;
            --disabled: #3a1c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-top: 80px;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: linear-gradient(180deg, #000000 70%, rgba(255, 0, 0, 0.4) 100%);
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }

        .wrapper {
            width: 100%;
            max-width: 520px;
            padding: 0 12px;
        }

        .loader {
            text-align: center;
            color: var(--text-sub);
            margin-top: 40px;
            font-size: 1rem;
        }

        /* Шапка игры (Иконка + Название) */
        .game-top-card {
            background: var(--card-bg);
            border: 1px solid #262931;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .game-icon {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            background: #20232c;
            border: 1px solid #323644;
            object-fit: cover;
            flex-shrink: 0;
        }

        .game-title-area h2 {
            font-size: 1.4rem;
            line-height: 1.2;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
            background: #222733;
            color: var(--green);
            margin-top: 6px;
        }

        /* Вкладки */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            background: #16181e;
            border: 1px solid #262931;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 10px 6px;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            border-color: var(--accent);
            border-bottom: 2px solid var(--card-bg); /* Сливается с контентным блоком */
        }

        /* Контентная панель со скроллом */
        .content-box {
            background: var(--card-bg);
            border: 1px solid #262931;
            border-radius: 0 16px 16px 16px;
            padding: 20px;
            max-height: 450px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .desc-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            background: #101116;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #1c1e26;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        .requirements {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.4;
            background: #101116;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1c1e26;
        }

        /* Большая кнопка Скачать */
        .download-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            background: var(--green);
            color: #000;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 20px;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn span {
            font-size: 0.75rem;
            font-weight: normal;
            opacity: 0.85;
            margin-top: 2px;
        }

        .btn-disabled {
            background: var(--disabled);
            color: #ff6b6b;
            cursor: not-allowed;
            border: 1px solid #522323;
            pointer-events: none;
            box-shadow: none;
        }

        /* Кастомный красивый скроллбар */
        .content-box::-webkit-scrollbar {
            width: 6px;
        }
        .content-box::-webkit-scrollbar-track {
            background: #101116;
            border-radius: 4px;
        }
        .content-box::-webkit-scrollbar-thumb {
            background: #323644;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>RVIVE</h1>
    </header>

    <div class="wrapper">
        <main id="app-container">
            <div class="loader">Загрузка информации об игре...</div>
        </main>
    </div>

    <script>
        function switchTab(tabName) {
            // Переключаем активные кнопки вкладок
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');

            // Переключаем контент
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        async function loadGameDetails() {
            const container = document.getElementById('app-container');
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('id');

            if (!appId) {
                container.innerHTML = `<div class="loader" style="color: #ff3333;">Ошибка: не указан ID приложения в ссылке (?id=...)</div>`;
                return;
            }

            try {
                // Подгружаем твой games.json (укажи актуальный путь или сырую ссылку github)
                const res = await fetch('https://raw.githubusercontent.com/Amarasenik/Rvive/refs/heads/main/games.json');
                if (!res.ok) throw new Error('Не удалось получить базу данных');
                
                const apps = await res.json();
                // Ищем элемент, у которого совпадает id (или создадим поле id в json, либо ищем по имени/заголовку)
                const app = apps.find(item => item.id === appId || item.title.toLowerCase() === appId.toLowerCase());

                if (!app) {
                    container.innerHTML = `<div class="loader" style="color: #ff3333;">Приложение с ID "${appId}" не найдено в базе данных!</div>`;
                    return;
                }

                const win = app.platforms?.windows || {};
                const android = app.platforms?.android || {};

                container.innerHTML = `
                    <!-- Шапка игры (Иконка + Название) -->
                    <div class="game-top-card">
                        <img src="${app.icon || ''}" alt="${app.title}" class="game-icon" onerror="this.src='https://via.placeholder.com/75?text=APP'">
                        <div class="game-title-area">
                            <h2>${app.title}</h2>
                            <span class="badge">v${app.version || '1.0'}</span>
                        </div>
                    </div>

                    <!-- Вкладки -->
                    <div class="tabs-container">
                        <div class="tab-btn active" onclick="switchTab('desc')">Описание</div>
                        <div class="tab-btn" onclick="switchTab('win')">Windows</div>
                        <div class="tab-btn" onclick="switchTab('android')">Android</div>
                    </div>

                    <!-- Контент вкладок -->
                    <div class="content-box">
                        <!-- Вкладка: Описание -->
                        <div id="tab-desc" class="tab-content active">
                            <div class="section-title">ОБ ИГРЕ</div>
                            <div class="desc-text">${app.description || 'Описание отсутствует.'}</div>
                        </div>

                        <!-- Вкладка: Windows -->
                        <div id="tab-win" class="tab-content">
                            ${win.available 
                                ? `<a href="${win.url}" class="download-btn" download>СКАЧАТЬ ДЛЯ ПК<span>Прямая ссылка</span></a>`
                                : `<div class="download-btn btn-disabled">НЕДОСТУПНО<span>Версия для Windows пока отсутствует</span></div>`}
                            
                            <div class="section-title">Системные требования (ПК):</div>
                            <div class="requirements">${win.requirements || 'Требования не указаны.'}</div>
                        </div>

                        <!-- Вкладка: Android -->
                        <div id="tab-android" class="tab-content">
                            ${android.available 
                                ? `<a href="${android.url}" class="download-btn" download>СКАЧАТЬ APK<span>Для мобильных устройств</span></a>`
                                : `<div class="download-btn btn-disabled">СКОРО<span>Версия для Android в разработке</span></div>`}
                            
                            <div class="section-title">Системные требования (Android):</div>
                            <div class="requirements">${android.requirements || 'Требования не указаны.'}</div>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="loader" style="color: #ff3333;">Ошибка загрузки данных. Проверьте соединение или games.json.</div>`;
            }
        }

        loadGameDetails();
    </script>
</body>
</html>
