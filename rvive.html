<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rvive | Игровой хаб</title>
    <style>
        :root {
            --dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #ff0000;
            --success: #39ff14;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(90deg, #000000 60%, var(--accent) 100%);
            padding: 20px 40px;
            border-bottom: 2px solid #222;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 3px;
            font-weight: 900;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
            margin-top: 50px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-left: 5px solid var(--accent);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-radius: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.2);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .game-icon {
            width: 64px;
            height: 64px;
            background: #252525;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #333;
        }

        .game-details h2 {
            margin: 0 0 5px 0;
            font-size: 1.4rem;
        }

        .game-details p {
            margin: 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        .game-version {
            display: inline-block;
            background: #333;
            color: var(--success);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }

        .download-btn {
            background-color: var(--success);
            color: #000;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background-color: #2ecc71;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>RVIVE</h1>
    </header>

    <div class="container">
        <div id="games-list">
            <div class="loader">Загрузка списка игр...</div>
        </div>
    </div>

    <script>
        // Функция автоматической загрузки игр из JSON
        async function loadGames() {
            const container = document.getElementById('games-list');
            
            try {
                // Запрашиваем файл games.json
                const response = await fetch('games.json');
                
                if (!response.ok) {
                    throw new Error('Не удалось загрузить games.json');
                }
                
                const games = await response.json();
                container.innerHTML = ''; // Очищаем заставку загрузки

                // Пробегаемся по каждой игре в JSON и строим HTML
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    card.innerHTML = `
                        <div class="game-info">
                            <img src="${game.icon}" alt="${game.title}" class="game-icon" onerror="this.src='https://via.placeholder.com/64?text=GAME'">
                            <div class="game-details">
                                <h2>${game.title} <span class="game-version">v${game.version}</span></h2>
                                <p>${game.description}</p>
                            </div>
                        </div>
                        <a href="${game.download_url}" class="download-btn" target="_blank">Скачать</a>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="loader" style="color: #ff4444;">Ошибка загрузки базы данных игр!</div>`;
            }
        }

        // Запускаем при открытии страницы
        loadGames();
    </script>

</body>
</html>
